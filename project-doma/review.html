<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Просмотр макетов — Проект дома</title><style>body{margin:0;background:#363639;color:#ffffff;font:14px Arial}header{padding:16px 24px;background:#212124;display:flex;align-items:center;gap:24px;flex-wrap:wrap}a{color:inherit;text-decoration:none}button,select{padding:10px 16px;color:#ffffff;border:1px solid #666;background:none;font:inherit;cursor:pointer}option{background:#212124}button.active{background:#ffffff;color:#202023;border-color:#ffffff}main{padding:30px;display:flex;justify-content:flex-start;overflow:auto}iframe{flex-shrink:0;margin:auto;border:0;width:390px;height:1000px;background:#151518;box-shadow:0 20px 60px #0005}p{max-width:700px;margin:0 auto 24px;text-align:center;color:#ccc;font-size:12px}header>a:last-child{margin-left:auto}@media(max-width:600px){header{gap:12px;padding:16px}main{padding:16px 0}iframe{max-width:100%}}</style><header><a href="index.html">Проект дома · редизайн</a><select id="page" aria-label="Страница для просмотра"><option value="index">Главная</option><option value="service">Услуга</option><option value="catalog">Каталог</option><option value="project">Проект</option></select><button id="mobile" class="active">Телефон</button><button id="desktop">Компьютер</button><a href="export.html">Макеты для Figma ↓</a></header><main><iframe id="frame" title="Предпросмотр страницы на телефоне" src="index.html?preview=1"></iframe></main><p>Нажимайте на ссылки, открывайте галерею и формы. Демонстрационные формы не отправляют данные.</p><script>const frame=document.querySelector('#frame'),select=document.querySelector('#page');frame.addEventListener('load',()=>{const name=frame.contentWindow.location.pathname.split('/').pop().replace('.html','')||'index';if(['index','service','catalog','project'].includes(name))select.value=name;frame.contentDocument.documentElement.style.scrollbarWidth='none';});select.onchange=()=>frame.src=select.value+'.html?preview=1';document.querySelector('#mobile').onclick=()=>{frame.style.width='390px';frame.title='Предпросмотр страницы на телефоне';document.querySelector('#mobile').classList.add('active');document.querySelector('#desktop').classList.remove('active')};document.querySelector('#desktop').onclick=()=>{frame.style.width='1440px';frame.title='Предпросмотр страницы на компьютере';document.querySelector('#desktop').classList.add('active');document.querySelector('#mobile').classList.remove('active')};</script></html>
